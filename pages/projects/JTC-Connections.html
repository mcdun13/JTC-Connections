<head>
    <meta charset="UTF-8">

    <title>JTC Connections</title>

    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/styles-connections.css">

</head>
<body>
    <script src="/js/simple-header.js"></script>
    <script>createHeader(
        '/assets/images/trophy-logo.jpg',
        '/index.html',
        [{ text: '', href: 'pages/projects/JTC-Connections.html' }]

        <a href="../../index.html" aria-label="Home">
            <img src="/assets/images/trophy-logo.jpg" alt="Home"  class="nav-icon">

    <main>
    <div class="game-container">
        <div class="header">
            <!-- <img src="images/IMG_5024.jpg" width="500" height="500" alt="Trophy" class="trophy-icon"> -->
            <h1>JTC Connections</h1>
            <div class="subtitle">Create four groups of four!</div>
        </div>

        <div class="solved-categories" id="solvedCategories"></div>

        <div class="message" id="message"></div>

        <div class="grid" id="grid"></div>

        <div class="mistakes">
            Mistakes remaining:
            <span class="mistake-dots">
                <span class="mistake-dot" id="dot1"></span>
                <span class="mistake-dot" id="dot2"></span>
                <span class="mistake-dot" id="dot3"></span>
                <span class="mistake-dot" id="dot4"></span>
            </span>
        </div>

        <div class="controls">
            <button class="shuffle-btn" onclick="shuffleWords()">Shuffle</button>
            <button class="deselect-btn" onclick="deselectAll()">Deselect All</button>
            <button class="submit-btn" id="submitBtn" onclick="submitGuess()" disabled>Submit</button>
        </div>

        <div class="end-screen" id="endScreen">
            <h2 id="endTitle"></h2>
            <div id="endMessage"></div>
            <div class="emoji-summary" id="emojiSummary"></div>
            <!-- <button class="share-btn" onclick="shareResults()">Share Results</button> -->
            <button class="play-again-btn" onclick="resetGame()">Play Again</button>
        </div>
    </div>
</main>
