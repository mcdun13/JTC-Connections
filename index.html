<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landing Page</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAVBAR */
    header {
  display: flex;
  align-items: center;
  padding: 16px 24px;
  gap: 16px; /* controls space between logo and Projects */
}

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: black;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .logo img {
      height: 100px;
      margin-right: 8px;
    }

    nav a {
      text-decoration: none;
      color: black;
      font-size: 1rem;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* MAIN CONTENT */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-container {
      border: 4px solid black;
      padding: 8px;
    }

    .image-container img {
      max-width: 80vw;
      max-height: 70vh;
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="logo">
     <img src="images/louie-and-me-cartoon-logo.png" alt="Logo"> 
      
    </a>

    <nav>
      <a href="JTC-Connections.html">Projects</a>
    </nav>
  </header>

  <main>
    <div class="image-container">
      <img src="images/louie-dont-panic.webp" alt="louie-dont-panic">
    </div>
  </main>

</body>
</html>
