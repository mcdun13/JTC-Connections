<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JTC Connections</title>
    <link rel="icon" type="image/png" href="images/IMG_5024.jpg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .trophy-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            display: block;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 0.9rem;
        }

        .solved-categories {
            margin-bottom: 20px;
        }

        .category-result {
            background-color: #f0f0f0;
            padding: 20px;
            margin-bottom: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .category-result.yellow { background-color: #f9df6d; }
        .category-result.green { background-color: #a0c35a; }
        .category-result.blue { background-color: #b0c4ef; }
        .category-result.purple { background-color: #ba81c5; }

        .category-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .category-words {
            font-size: 0.95rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .word-tile {
            background-color: #efefe6;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
            user-select: none;
            padding: 10px;
        }

        .word-tile:hover {
            background-color: #e0e0d8;
        }

        .word-tile.selected {
            background-color: #5a594e;
            color: white;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .word-tile.shake {
            animation: shake 0.3s ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .word-tile.bounce {
            animation: bounce 0.5s ease-in-out;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .shuffle-btn {
            background-color: #fff;
            border: 2px solid #000;
        }

        .shuffle-btn:hover {
            background-color: #f0f0f0;
        }

        .deselect-btn {
            background-color: #fff;
            border: 2px solid #000;
        }

        .deselect-btn:hover {
            background-color: #f0f0f0;
        }

        .submit-btn {
            background-color: #000;
            color: white;
        }

        .submit-btn:hover {
            background-color: #333;
        }

        .submit-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .mistakes {
            text-align: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #666;
        }

        .mistake-dots {
            display: inline-flex;
            gap: 8px;
            margin-left: 10px;
        }

        .mistake-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #e0e0e0;
        }

        .mistake-dot.used {
            background-color: #5a594e;
        }

        .message {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 600;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
        }

        .message.one-away {
            background-color: #fff3cd;
            color: #856404;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
        }

        .end-screen {
            text-align: center;
            padding: 40px 20px;
            display: none;
        }

        .end-screen.show {
            display: block;
        }

        .end-screen h2 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .emoji-summary {
            font-size: 2rem;
            line-height: 1.2;
            margin: 20px 0;
            letter-spacing: 2px;
        }

        .share-btn {
            background-color: #538d4e;
            color: white;
            padding: 12px 24px;
            margin: 10px;
            border-radius: 20px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .share-btn:hover {
            background-color: #6aaa64;
        }

        .play-again-btn {
            background-color: #000;
            color: white;
            padding: 15px 30px;
            margin-top: 20px;
        }

        .play-again-btn:hover {
            background-color: #333;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <img src="images/IMG_5024.jpg" width="500" height="500" alt="Trophy" class="trophy-icon">
            <h1>JTC Connections</h1>
            <div class="subtitle">Create four groups of four!</div>
        </div>

        <div class="solved-categories" id="solvedCategories"></div>

        <div class="message" id="message"></div>

        <div class="grid" id="grid"></div>

        <div class="mistakes">
            Mistakes remaining:
            <span class="mistake-dots">
                <span class="mistake-dot" id="dot1"></span>
                <span class="mistake-dot" id="dot2"></span>
                <span class="mistake-dot" id="dot3"></span>
                <span class="mistake-dot" id="dot4"></span>
            </span>
        </div>

        <div class="controls">
            <button class="shuffle-btn" onclick="shuffleWords()">Shuffle</button>
            <button class="deselect-btn" onclick="deselectAll()">Deselect All</button>
            <button class="submit-btn" id="submitBtn" onclick="submitGuess()" disabled>Submit</button>
        </div>

        <div class="end-screen" id="endScreen">
            <h2 id="endTitle"></h2>
            <div id="endMessage"></div>
            <div class="emoji-summary" id="emojiSummary"></div>
            <button class="share-btn" onclick="shareResults()">Share Results</button>
            <button class="play-again-btn" onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <script>
        const categories = [
            {
                title: "Things found at recess",
                words: ["Football", "Swing", "Track", "Soccer ball"],
                color: "yellow",
                difficulty: 1
            },
            {
                title: "What you'll find in the front office",
                words: ["Nurse", "Turtle", "Dylan", "Erick"],
                color: "green",
                difficulty: 2
            },
            {
                title: "Radio code colors",
                words: ["School bus", "Grass", "Blood", "Basketball"],
                color: "blue",
                difficulty: 3
            },
            {
                title: "Connections to reset areas (Minecraft, Pokémon, Ocean, Focus)",
                words: ["Steve", "May", "Indian", "Meditation"],
                color: "purple",
                difficulty: 4
            }
        ];

        let remainingWords = [];
        let selectedWords = [];
        let solvedCategories = [];
        let mistakesRemaining = 4;
        let gameOver = false;
        let previousGuesses = [];
        let guessHistory = []; // Track all guesses with their results

        function initGame() {
            remainingWords = categories.flatMap(cat => cat.words);
            shuffleArray(remainingWords);
            renderGrid();
            updateMistakes();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            remainingWords.forEach(word => {
                const tile = document.createElement('div');
                tile.className = 'word-tile';
                if (selectedWords.includes(word)) {
                    tile.classList.add('selected');
                }
                tile.textContent = word;
                tile.onclick = () => toggleWord(word);
                grid.appendChild(tile);
            });

            updateSubmitButton();
        }

        function toggleWord(word) {
            if (gameOver) return;

            const index = selectedWords.indexOf(word);
            if (index > -1) {
                selectedWords.splice(index, 1);
            } else {
                if (selectedWords.length < 4) {
                    selectedWords.push(word);
                }
            }
            renderGrid();
        }

        function deselectAll() {
            selectedWords = [];
            renderGrid();
            hideMessage();
        }

        function shuffleWords() {
            shuffleArray(remainingWords);
            renderGrid();
        }

        function updateSubmitButton() {
            const btn = document.getElementById('submitBtn');
            if (selectedWords.length !== 4) {
                btn.disabled = true;
                return;
            }
            
            // Check if this exact guess has been tried before
            const sortedGuess = [...selectedWords].sort().join(',');
            const alreadyGuessed = previousGuesses.some(guess => 
                [...guess].sort().join(',') === sortedGuess
            );
            
            btn.disabled = alreadyGuessed;
        }

        function submitGuess() {
            if (selectedWords.length !== 4 || gameOver) return;

            // Add this guess to previous guesses
            previousGuesses.push([...selectedWords]);

            hideMessage();

            // Check if selection matches any category
            const matchedCategory = categories.find(cat => {
                if (solvedCategories.includes(cat)) return false;
                return cat.words.every(word => selectedWords.includes(word));
            });

            if (matchedCategory) {
                // Correct guess - bounce animation!
                guessHistory.push({ correct: true, category: matchedCategory, words: [...selectedWords] });
                
                const tiles = document.querySelectorAll('.word-tile.selected');
                tiles.forEach((tile, index) => {
                    setTimeout(() => {
                        tile.classList.add('bounce');
                    }, index * 100);
                });

                setTimeout(() => {
                    solvedCategories.push(matchedCategory);
                    remainingWords = remainingWords.filter(word => !selectedWords.includes(word));
                    selectedWords = [];
                    
                    renderSolvedCategory(matchedCategory);
                    renderGrid();

                    // Check win condition
                    if (solvedCategories.length === 4) {
                        setTimeout(() => showEndScreen(true), 1000);
                    }
                }, 800);
            } else {
                // Incorrect guess - shake animation!
                guessHistory.push({ correct: false, words: [...selectedWords] });
                
                const tiles = document.querySelectorAll('.word-tile.selected');
                tiles.forEach(tile => {
                    tile.classList.add('shake');
                });

                setTimeout(() => {
                    tiles.forEach(tile => {
                        tile.classList.remove('shake');
                    });

                    // Always count the mistake first
                    mistakesRemaining--;
                    updateMistakes();

                    // Check if one away (for message only)
                    const oneAway = categories.find(cat => {
                        if (solvedCategories.includes(cat)) return false;
                        const matches = cat.words.filter(word => selectedWords.includes(word)).length;
                        return matches === 3;
                    });

                    if (oneAway) {
                        showMessage("One away...", "one-away");
                    }
                    
                    if (mistakesRemaining === 0) {
                        gameOver = true;
                        // Show all remaining categories
                        categories.forEach(cat => {
                            if (!solvedCategories.includes(cat)) {
                                renderSolvedCategory(cat);
                            }
                        });
                        setTimeout(() => showEndScreen(false), 1500);
                    }
                    
                    // Keep selection highlighted after incorrect guess
                    renderGrid();
                }, 300);
            }
        }

        function renderSolvedCategory(category) {
            const container = document.getElementById('solvedCategories');
            const div = document.createElement('div');
            div.className = `category-result ${category.color}`;
            div.innerHTML = `
                <div class="category-title">${category.title}</div>
                <div class="category-words">${category.words.join(', ')}</div>
            `;
            container.appendChild(div);
        }

        function updateMistakes() {
            for (let i = 1; i <= 4; i++) {
                const dot = document.getElementById(`dot${i}`);
                if (4 - i < mistakesRemaining) {
                    dot.classList.remove('used');
                } else {
                    dot.classList.add('used');
                }
            }
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type} show`;
            
            setTimeout(() => {
                msg.classList.remove('show');
            }, 2000);
        }

        function hideMessage() {
            const msg = document.getElementById('message');
            msg.classList.remove('show');
        }

        function showEndScreen(won) {
            document.getElementById('grid').style.display = 'none';
            document.querySelector('.controls').style.display = 'none';
            document.querySelector('.mistakes').style.display = 'none';
            
            const endScreen = document.getElementById('endScreen');
            const endTitle = document.getElementById('endTitle');
            const endMessage = document.getElementById('endMessage');
            const emojiSummary = document.getElementById('emojiSummary');
            
            if (won) {
                endTitle.textContent = '🎉 Congratulations! 🎉';
                endMessage.textContent = 'You solved all the categories!';
            } else {
                endTitle.textContent = 'Game Over';
                endMessage.textContent = 'Better luck next time!';
            }
            
            // Generate emoji summary
            emojiSummary.innerHTML = generateEmojiSummary();
            
            endScreen.classList.add('show');
        }

        function generateEmojiSummary() {
            const colorEmojis = {
                'yellow': '🟨',
                'green': '🟩',
                'blue': '🟦',
                'purple': '🟪'
            };
            
            let rows = [];
            
            guessHistory.forEach(guess => {
                if (guess.correct) {
                    // Correct guess - all 4 same color
                    const emoji = colorEmojis[guess.category.color];
                    rows.push(emoji + emoji + emoji + emoji);
                } else {
                    // Incorrect guess - show mixed colors based on which category each word belongs to
                    let row = '';
                    guess.words.forEach(word => {
                        const wordCategory = categories.find(cat => cat.words.includes(word));
                        row += colorEmojis[wordCategory.color];
                    });
                    rows.push(row);
                }
            });
            
            return rows.join('<br>');
        }

        function shareResults() {
            const colorEmojis = {
                'yellow': '🟨',
                'green': '🟩',
                'blue': '🟦',
                'purple': '🟪'
            };
            
            let rows = ['JTC Connections'];
            
            guessHistory.forEach(guess => {
                if (guess.correct) {
                    // Correct guess - all 4 same color
                    const emoji = colorEmojis[guess.category.color];
                    rows.push(emoji + emoji + emoji + emoji);
                } else {
                    // Incorrect guess - show mixed colors based on which category each word belongs to
                    let row = '';
                    guess.words.forEach(word => {
                        const wordCategory = categories.find(cat => cat.words.includes(word));
                        row += colorEmojis[wordCategory.color];
                    });
                    rows.push(row);
                }
            });
            
            let result = rows.join('\n');
            
            // Copy to clipboard
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(result).then(() => {
                    const btn = document.querySelector('.share-btn');
                    const originalText = btn.textContent;
                    btn.textContent = 'Copied!';
                    setTimeout(() => {
                        btn.textContent = originalText;
                    }, 2000);
                }).catch(err => {
                    console.error('Copy failed:', err);
                    alert('Could not copy to clipboard: ' + result);
                });
            } else {
                // Fallback for browsers that don't support clipboard API
                alert('Copy this:\n\n' + result);
            }
        }

        function resetGame() {
            // Reset all game state
            remainingWords = [];
            selectedWords = [];
            solvedCategories = [];
            mistakesRemaining = 4;
            gameOver = false;
            previousGuesses = [];
            guessHistory = [];
            
            // Reset UI
            document.getElementById('solvedCategories').innerHTML = '';
            document.getElementById('grid').style.display = 'grid';
            document.querySelector('.controls').style.display = 'flex';
            document.querySelector('.mistakes').style.display = 'block';
            document.getElementById('endScreen').classList.remove('show');
            
            // Reset mistake dots
            for (let i = 1; i <= 4; i++) {
                document.getElementById(`dot${i}`).classList.remove('used');
            }
            
            hideMessage();
            initGame();
        }

        // Initialize game on load
        initGame();
    </script>
</body>
</html>
